<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b73ff"/>
      <stop offset="100%" style="stop-color:#6c63ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6c63ff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>
  <!-- Gaussian splat blobs -->
  <ellipse cx="200" cy="200" rx="60" ry="50" fill="#6c63ff" opacity="0.3"/>
  <ellipse cx="300" cy="180" rx="55" ry="65" fill="#7b73ff" opacity="0.25"/>
  <ellipse cx="250" cy="260" rx="70" ry="45" fill="#5b54e0" opacity="0.35"/>
  <ellipse cx="180" cy="280" rx="40" ry="55" fill="#8a82ff" opacity="0.2"/>
  <ellipse cx="320" cy="250" rx="50" ry="40" fill="#6c63ff" opacity="0.3"/>
  <!-- Center bright splat -->
  <ellipse cx="256" cy="230" rx="45" ry="40" fill="#6c63ff" opacity="0.7"/>
  <ellipse cx="256" cy="230" rx="25" ry="22" fill="#9b94ff" opacity="0.8"/>
  <ellipse cx="256" cy="230" rx="10" ry="9" fill="white" opacity="0.9"/>
  <!-- Mesh wireframe hint -->
  <g stroke="#6c63ff" stroke-width="1.5" fill="none" opacity="0.4">
    <polygon points="160,320 256,280 352,320"/>
    <polygon points="160,320 256,360 352,320"/>
    <line x1="256" y1="280" x2="256" y2="360"/>
    <line x1="160" y1="320" x2="208" y2="300"/>
    <line x1="352" y1="320" x2="304" y2="300"/>
  </g>
  <!-- Arrow (mesh to splat) -->
  <g transform="translate(256,390)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#6c63ff" stroke-width="3" stroke-linecap="round"/>
    <polyline points="18,-10 30,0 18,10" stroke="#6c63ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="256" y="445" text-anchor="middle" fill="white" font-family="-apple-system,SF Pro Display,Helvetica" font-size="48" font-weight="600" letter-spacing="-1">G-Splat</text>
</svg>
